<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CEFR Placement Test A</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --paper:#f6f3ec;
    --ink:#22261f;
    --ink-soft:#5a5b52;
    --rule:#d8d3c4;
    --accent:#8a3324;
    --accent-soft:#c96a4d;
    --good:#3f6b4a;
    --bad:#a3402c;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  header.top .brand{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  h1{
    font-size:28px;
    margin:4px 0 18px;
    font-weight:600;
  }
  .name-row{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:22px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .name-row input{
    font-family:inherit;
    font-size:14px;
    border:none;
    border-bottom:1px solid var(--rule);
    background:transparent;
    color:var(--ink);
    padding:2px 4px;
    flex:1;
    max-width:260px;
  }
  .name-row input:focus{outline:none;border-bottom-color:var(--accent);}

  /* progress ribbon = signature element: torn page tabs */
  .progress-ribbon{
    display:flex;
    gap:3px;
    margin:18px 0 28px;
  }
  .tab{
    flex:1;
    height:8px;
    background:var(--rule);
    border-radius:1px;
    position:relative;
    overflow:hidden;
  }
  .tab .fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--accent-soft);
    transition:width .25s ease;
  }
  .tab.current .fill{background:var(--accent);}
  .progress-label{
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    margin-top:-20px;
    margin-bottom:26px;
  }

  .passage{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--accent-soft);
    padding:16px 18px;
    margin:0 0 20px;
    font-size:15px;
    color:#37392f;
  }
  .passage .tag{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin-bottom:8px;
    display:block;
  }

  .qcard{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .writing-box{
    width:100%;
    min-height:140px;
    font-family:inherit;
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:12px 14px;
    resize:vertical;
  }
  .writing-box:focus{outline:none;border-color:var(--accent-soft);}
  .wordcount{
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    margin-top:6px;
  }
  .writing-review{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--accent-soft);
    padding:14px 18px;
    margin-bottom:12px;
    font-size:14.5px;
    white-space:pre-wrap;
  }
  .writing-review .wtitle{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent);
    margin-bottom:8px;
    display:block;
  }
  .writing-review .wprompt{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
    font-style:italic;
  }
  .writing-review .wempty{
    color:var(--ink-soft);
    font-style:italic;
  }
  .qnum{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:6px;
  }
  .qtext{
    font-size:17px;
    margin-bottom:14px;
  }
  .qtext .dialogue-a{color:var(--ink-soft);font-style:italic;}
  .blank{
    display:inline-block;
    min-width:64px;
    border-bottom:1px solid var(--ink);
    margin:0 2px;
  }
  .options{
    display:grid;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 12px;
    border:1px solid var(--rule);
    border-radius:2px;
    cursor:pointer;
    font-size:15.5px;
    transition:background .12s, border-color .12s;
  }
  .opt:hover{background:#f1ede0;}
  .opt input{accent-color:var(--accent);margin:0;}
  .opt.selected{border-color:var(--accent);background:#f4e9e2;}
  .opt .letter{
    font-weight:600;
    color:var(--accent);
    width:14px;
  }

  .navbtns{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    gap:10px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:11px 22px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  button.ghost{
    background:transparent;
    color:var(--ink);
  }
  button:disabled{opacity:.35;cursor:not-allowed;}
  button:hover:not(:disabled){opacity:.85;}

  .page-badge{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }

  /* results */
  .results h2{font-size:24px;margin-bottom:4px;}
  .score-hero{
    background:var(--card);
    border:1px solid var(--rule);
    padding:26px 22px;
    text-align:center;
    margin:20px 0 26px;
  }
  .score-hero .num{
    font-size:56px;
    font-weight:700;
    color:var(--accent);
    line-height:1;
  }
  .score-hero .outof{font-size:15px;color:var(--ink-soft);}
  .score-hero .level{
    margin-top:14px;
    font-size:15px;
    display:inline-block;
    padding:8px 16px;
    border:1px solid var(--accent-soft);
    border-radius:16px;
    color:var(--accent);
    max-width:90%;
    line-height:1.4;
  }
  table.breakdown{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin-bottom:24px;
  }
  table.breakdown th, table.breakdown td{
    text-align:left;
    padding:8px 6px;
    border-bottom:1px solid var(--rule);
  }
  table.breakdown th{color:var(--ink-soft);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
  .bar-bg{background:var(--rule);height:6px;border-radius:3px;overflow:hidden;width:100%;}
  .bar-fill{background:var(--accent-soft);height:100%;}

  .review-item{
    border:1px solid var(--rule);
    border-left:3px solid var(--rule);
    padding:12px 16px;
    margin-bottom:8px;
    font-size:14px;
  }
  .review-item.wrong{border-left-color:var(--bad);}
  .review-item.right{border-left-color:var(--good);}
  .review-item .qn{color:var(--ink-soft);font-size:12px;margin-bottom:3px;}
  .review-item .your{color:var(--bad);}
  .review-item .correct{color:var(--good);}

  footer.note{
    margin-top:40px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--rule);
    padding-top:14px;
  }

  @media (max-width:480px){
    h1{font-size:23px;}
    .qtext{font-size:15.5px;}
    .score-hero .num{font-size:44px;}
  }
</style>
</head>

/* ---------------- RESULTS AUTO-COLLECTION ----------------
   To automatically collect every student's results in a Google Sheet:
   1. Create a new Google Sheet.
   2. In the Sheet, go to Extensions > Apps Script, paste the script
      from the accompanying "google_apps_script.gs" file, and save.
   3. Click Deploy > New deployment > select type "Web app".
      - Execute as: Me
      - Who has access: Anyone
   4. Click Deploy, authorize it, and copy the Web app URL it gives you.
   5. Paste that URL below, between the quotes.
   Leave it blank ("") to disable auto-collection — results will still
   work fine with the Download/Copy buttons on the results screen.
------------------------------------------------------------- */
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwVeRDZtyH9dArBQrNqKd62RQVypJXrNZlUbkHicQ-0X8YtmidyKz71ytazWNY33RRy/exec";

const WRITING_TASKS = [
  {
    id: "w1",
    label: "Task 1 · About you",
    prompt: "Write about yourself. Include your name, where you're from, your job or studies, your family, and what you like to do in your free time.",
    suggested: "40–60 words"
  },
  {
    id: "w2",
    label: "Task 2 · A story",
    prompt: "Write a short email or message to a friend about your last holiday or a memorable weekend. What did you do? Who were you with? How did you feel?",
    suggested: "80–120 words"
  }
];

const TOTAL_PAGES = 9; // pages 1–8 are multiple choice, page 9 is writing
const answers = new Array(Q.length).fill(null);
const writingAnswers = {};
WRITING_TASKS.forEach(t => writingAnswers[t.id] = "");
let currentPage = 1;
let studentName = "";
let submitted = false;
let resultsSent = false;

/* ---------------- RENDER ---------------- */
const app = document.getElementById('app');

function pageQuestions(p){ return Q.filter(q => q.page === p); }

function letters(i){ return ["a","b","c","d"][i]; }

function renderStem(text){
  const parts = text.split("____");
  if(parts.length === 1) return escapeHtml(text).replace(/\n/g,"<br>");
  return parts.map(escapeHtml).join('<span class="blank"></span>').replace(/\n/g,"<br>");
}
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function wordCount(s){
  return (s.trim().match(/\S+/g) || []).length;
}

function renderProgress(){
  let tabs = "";
  for(let p=1;p<=TOTAL_PAGES;p++){
    let pct;
    if(p === 9){
      const filled = WRITING_TASKS.filter(t => writingAnswers[t.id].trim().length > 0).length;
      pct = Math.round((filled / WRITING_TASKS.length) * 100);
    } else {
      const qs = pageQuestions(p);
      const answeredCount = qs.filter(q => answers[Q.indexOf(q)] !== null).length;
      pct = Math.round((answeredCount/qs.length)*100);
    }
    tabs += `<div class="tab ${p===currentPage?'current':''}"><div class="fill" style="width:${pct}%"></div></div>`;
  }
  return `<div class="progress-ribbon">${tabs}</div>
  <div class="progress-label">Page ${currentPage} of ${TOTAL_PAGES}</div>`;
}

function renderIntro(){
  app.innerHTML = `
    <header class="top">
      <div class="brand">Headway · 5th Edition</div>
      <div class="brand">CEFR Placement Test A</div>
    </header>
    <h1>English Placement Test</h1>
    <p style="color:var(--ink-soft);font-size:15px;max-width:56ch;">
      100 multiple-choice questions across 8 pages, covering grammar, everyday conversation,
      vocabulary, and two short reading passages — followed by a short writing task on page 9.
      There's no time limit — take your time and answer as best you can.
    </p>
    <div class="name-row" style="margin-top:22px;">
      Name: <input id="nameInput" type="text" placeholder="Type your name" />
    </div>
    <div class="navbtns" style="justify-content:flex-start;">
      <button id="startBtn">Start test</button>
    </div>
    <footer class="note">Your answers are only stored in this browser tab — nothing is sent anywhere. Refreshing the page will reset your progress.</footer>
  `;
  document.getElementById('startBtn').onclick = () => {
    studentName = document.getElementById('nameInput').value.trim();
    currentPage = 1;
    renderPage();
  };
}

function renderPage(){
  if(currentPage === 9){ renderWritingPage(); return; }

  const qs = pageQuestions(currentPage);
  let seenPassages = new Set();
  let html = `
    <header class="top">
      <div class="brand">Headway · 5th Edition</div>
      <div class="brand">CEFR Placement Test A</div>
    </header>
    <div class="page-badge">${studentName ? "Test taker: " + escapeHtml(studentName) : ""}</div>
    <h1 style="font-size:20px;">Page ${currentPage}</h1>
    ${renderProgress()}
  `;

  qs.forEach(q => {
    if(q.passage && !seenPassages.has(q.passage)){
      seenPassages.add(q.passage);
      const p = passages[q.passage];
      html += `<div class="passage"><span class="tag">${p.tag}</span>${p.body.split("\n\n").map(para=>`<p style="margin:0 0 8px;">${escapeHtml(para)}</p>`).join("")}</div>`;
    }
    const idx = Q.indexOf(q);
    html += `
      <div class="qcard" data-idx="${idx}">
        <div class="qnum">Question ${q.n} of 100</div>
        <div class="qtext">${renderStem(q.text)}</div>
        <div class="options">
          ${q.options.map((opt,i) => `
            <label class="opt ${answers[idx]===i?'selected':''}" data-idx="${idx}" data-opt="${i}">
              <input type="radio" name="q${idx}" ${answers[idx]===i?'checked':''} />
              <span class="letter">${letters(i)}</span><span>${escapeHtml(opt)}</span>
            </label>
          `).join("")}
        </div>
      </div>
    `;
  });

  html += `
    <div class="navbtns">
      <button class="ghost" id="prevBtn" ${currentPage===1?'disabled':''}>&larr; Previous</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>
  `;

  app.innerHTML = html;

  app.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const opt = parseInt(el.dataset.opt);
      answers[idx] = opt;
      renderPage();
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick = () => { currentPage--; window.scrollTo(0,0); renderPage(); };
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = () => { currentPage++; window.scrollTo(0,0); renderPage(); };
}

function renderWritingPage(){
  let html = `
    <header class="top">
      <div class="brand">Headway · 5th Edition</div>
      <div class="brand">CEFR Placement Test A</div>
    </header>
    <div class="page-badge">${studentName ? "Test taker: " + escapeHtml(studentName) : ""}</div>
    <h1 style="font-size:20px;">Page 9 · Writing</h1>
    ${renderProgress()}
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:20px;">
      This part isn't scored automatically — your teacher will read it and use it alongside your multiple-choice score.
      Write in full sentences and do your best; it's fine if it isn't perfect.
    </p>
  `;

  WRITING_TASKS.forEach(t => {
    const wc = wordCount(writingAnswers[t.id]);
    html += `
      <div class="qcard">
        <div class="qnum">${escapeHtml(t.label)} &middot; suggested length: ${t.suggested}</div>
        <div class="qtext" style="margin-bottom:10px;">${escapeHtml(t.prompt)}</div>
        <textarea class="writing-box" data-id="${t.id}" placeholder="Write your answer here...">${escapeHtml(writingAnswers[t.id])}</textarea>
        <div class="wordcount">${wc} word${wc===1?'':'s'}</div>
      </div>
    `;
  });

  html += `
    <div class="navbtns">
      <button class="ghost" id="prevBtn">&larr; Previous</button>
      <button id="finishBtn">Finish &amp; see results</button>
    </div>
  `;

  app.innerHTML = html;

  app.querySelectorAll('.writing-box').forEach(el => {
    el.addEventListener('input', () => {
      writingAnswers[el.dataset.id] = el.value;
      const card = el.closest('.qcard');
      card.querySelector('.wordcount').textContent = `${wordCount(el.value)} word${wordCount(el.value)===1?'':'s'}`;
      // update progress ribbon fill without a full re-render (keeps cursor focus)
      const tabs = document.querySelectorAll('.tab');
      const filled = WRITING_TASKS.filter(t => writingAnswers[t.id].trim().length > 0).length;
      const pct = Math.round((filled / WRITING_TASKS.length) * 100);
      const lastTab = tabs[tabs.length-1];
      if(lastTab) lastTab.querySelector('.fill').style.width = pct + "%";
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick = () => { currentPage--; window.scrollTo(0,0); renderPage(); };
  const finishBtn = document.getElementById('finishBtn');
  if(finishBtn) finishBtn.onclick = () => { submitted = true; window.scrollTo(0,0); renderResults(); };
}

function levelFor(score){
  if(score <= 40) return "A1 – low · Headway Beginner, Units 1–7";
  if(score <= 48) return "A1 – high · Headway Beginner, Units 8–14";
  if(score <= 56) return "A2 – low · Headway Elementary, Units 1–6";
  if(score <= 65) return "A2 – high · Headway Elementary, Units 7–12";
  if(score <= 74) return "B1 – low · Headway Pre-Intermediate, Units 1–6";
  if(score <= 83) return "B1 – low-medium · Headway Pre-Intermediate, Units 7–12";
  if(score <= 92) return "B1 – medium-high · Headway Intermediate, Units 1–6";
  if(score < 100) return "B1 – high · Headway Intermediate, Units 7–12";
  return "100%! Likely ready for B2 (Headway Upper-Intermediate) or, if the test felt easy, C1 (Headway Advanced)";
}

function renderResults(){
  const totalCorrect = Q.reduce((sum,q,i) => sum + (answers[i]===q.answer?1:0), 0);
  const unanswered = answers.filter(a=>a===null).length;

  if(!resultsSent){
    resultsSent = true;
    sendResultsToSheet(totalCorrect);
  }

  const pageStats = [];
  for(let p=1;p<=8;p++){
    const qs = pageQuestions(p);
    const correct = qs.reduce((sum,q)=> sum + (answers[Q.indexOf(q)]===q.answer?1:0),0);
    pageStats.push({page:p, correct, of:qs.length});
  }

  let html = `
    <header class="top">
      <div class="brand">Headway · 5th Edition</div>
      <div class="brand">CEFR Placement Test A</div>
    </header>
    <div class="results">
      <h2>${studentName ? escapeHtml(studentName) + "'s Results" : "Results"}</h2>
      <p style="color:var(--ink-soft);font-size:14px;">
        ${unanswered > 0 ? `${unanswered} question${unanswered===1?'':'s'} left unanswered (counted as incorrect).` : "All 100 questions answered."}
      </p>
      <div class="score-hero">
        <div class="num">${totalCorrect}</div>
        <div class="outof">out of 100</div>
        <div class="level">${levelFor(totalCorrect)}</div>
      </div>

      <table class="breakdown">
        <tr><th>Page</th><th>Score</th><th style="width:40%;">&nbsp;</th></tr>
        ${pageStats.map(s => `
          <tr>
            <td>Page ${s.page}</td>
            <td>${s.correct} / ${s.of}</td>
            <td><div class="bar-bg"><div class="bar-fill" style="width:${(s.correct/s.of)*100}%;"></div></div></td>
          </tr>
        `).join("")}
      </table>

      <h3 style="font-size:16px;margin-bottom:10px;">Writing (page 9) — for teacher review</h3>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-4px;">Not auto-scored. Read alongside the multiple-choice result to judge fluency and accuracy.</p>
      ${WRITING_TASKS.map(t => {
        const resp = writingAnswers[t.id].trim();
        return `<div class="writing-review">
          <span class="wtitle">${escapeHtml(t.label)} &middot; ${wordCount(writingAnswers[t.id])} words</span>
          <div class="wprompt">${escapeHtml(t.prompt)}</div>
          ${resp ? escapeHtml(resp) : '<span class="wempty">No response written.</span>'}
        </div>`;
      }).join("")}

      <h3 style="font-size:16px;margin:22px 0 10px;">Multiple-choice review</h3>
      ${Q.map((q,i) => {
        const correct = answers[i]===q.answer;
        const yourAnswer = answers[i]===null ? "No answer" : `${letters(answers[i])}) ${q.options[answers[i]]}`;
        return `<div class="review-item ${correct?'right':'wrong'}">
          <div class="qn">Question ${q.n}</div>
          <div>${renderStem(q.text)}</div>
          <div class="your">Your answer: ${escapeHtml(yourAnswer)}</div>
          ${!correct ? `<div class="correct">Correct answer: ${letters(q.answer)}) ${escapeHtml(q.options[q.answer])}</div>` : ""}
        </div>`;
      }).join("")}

      <div class="navbtns" style="justify-content:flex-start;margin-top:24px;gap:12px;">
        <button id="downloadBtn">Download results (.txt)</button>
        <button class="ghost" id="copyBtn">Copy summary</button>
        <button class="ghost" id="retakeBtn">Retake test</button>
      </div>
    </div>
    <footer class="note">
      Score bands and level guidance are from Oxford's official Headway CEFR Placement Test A answer key (2018).
    </footer>
  `;
  app.innerHTML = html;

  document.getElementById('downloadBtn').onclick = () => {
    const text = buildSummaryText(totalCorrect);
    const blob = new Blob([text], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(studentName||"student").replace(/\s+/g,"_")}_placement_test_results.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('copyBtn').onclick = async () => {
    const text = buildSummaryText(totalCorrect);
    try{
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(()=> btn.textContent = original, 1500);
    }catch(e){
      alert("Couldn't copy automatically — you can select and copy the results manually.");
    }
  };
  document.getElementById('retakeBtn').onclick = () => {
    answers.fill(null);
    WRITING_TASKS.forEach(t => writingAnswers[t.id] = "");
    currentPage = 1;
    submitted = false;
    renderIntro();
  };
}

function sendResultsToSheet(totalCorrect){
  if(!SHEET_WEBAPP_URL) return; // auto-collection not configured — silently skip
  const mcAnswers = Q.map((q,i) => answers[i]===null ? "-" : letters(answers[i])).join("");
  const payload = {
    name: studentName || "(no name given)",
    date: new Date().toISOString(),
    score: totalCorrect,
    level: levelFor(totalCorrect),
    mcAnswers: mcAnswers,
    writing1: writingAnswers["w1"] || "",
    writing2: writingAnswers["w2"] || ""
  };
  fetch(SHEET_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors", // Apps Script web apps don't return CORS headers; we don't need to read the response
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify(payload)
  }).catch(err => console.warn("Could not send results to sheet:", err));
}

function buildSummaryText(totalCorrect){
  const lines = [];
  lines.push("HEADWAY CEFR PLACEMENT TEST A — RESULTS");
  lines.push("Test taker: " + (studentName || "(name not given)"));
  lines.push("Date: " + new Date().toLocaleDateString());
  lines.push("");
  lines.push(`Score: ${totalCorrect} / 100`);
  lines.push(`Level: ${levelFor(totalCorrect)}`);
  lines.push("");
  lines.push("--- Multiple-choice answers ---");
  Q.forEach((q,i) => {
    const given = answers[i]===null ? "-" : letters(answers[i]);
    const correct = answers[i]===q.answer ? "correct" : `incorrect (correct: ${letters(q.answer)})`;
    lines.push(`Q${q.n}: ${given}  — ${correct}`);
  });
  lines.push("");
  lines.push("--- Writing responses ---");
  WRITING_TASKS.forEach(t => {
    lines.push(`\n${t.label} (${wordCount(writingAnswers[t.id])} words)`);
    lines.push(`Prompt: ${t.prompt}`);
    lines.push(writingAnswers[t.id].trim() || "(no response)");
  });
  return lines.join("\n");
}

renderIntro();
</script>
